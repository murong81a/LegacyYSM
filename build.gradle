buildscript {
    repositories {
        maven { url = uri('../localrepo') }
        maven { url = 'https://mirrors.ustc.edu.cn/bmclapi/' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
        maven { url = 'https://libraries.minecraft.net' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = '1.2.0-1.10.2'
group = 'com.elfmcys.yesstevemodel'
archivesBaseName = 'yesstevemodel-1.10.2'

sourceCompatibility = 1.8
targetCompatibility = 1.8

minecraft {
    suppressVersionTest = true
    version = '1.10.2-12.18.3.2511'
    runDir = 'run'
    mappings = 'stable_29'
    makeObfSourceJar = false
}

repositories {
    maven { url = 'https://maven.cleanroommc.com' }
    maven { url = 'https://mirrors.ustc.edu.cn/bmclapi/' }
    maven { url = 'https://maven.aliyun.com/repository/public' }
    maven { url = 'https://libraries.minecraft.net' }
    // The standalone Mixin jar is also the annotation processor (Mixin AP).
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    mavenCentral()
}

// Jabel is pulled from Maven Central (also proxied by the aliyun mirror above):
// CI has no local env/ directory. Same coordinates as env/jabel/*.jar locally.
def jabelVersion = '1.0.0'
def byteBuddyVersion = '1.12.18'
def jnaVersion = '5.12.1'

// Mixin AP output. Keep the name in sync with "refmap" in the Mixin configs.
def mixinRefmap = file("$buildDir/classes/java/main/mixins.yes_steve_model.refmap.json")
// ForgeGradle 2.3 downloads MCP stable_29 here during setup.
def mcpSrg = file("${gradle.gradleUserHomeDir}/caches/minecraft/de/oceanlabs/mcp/mcp_stable/29/1.10.2/srgs/mcp-srg.srg")

configurations {
    // Annotation processor only: never shipped in the mod jar or runtime classpath.
    mixinAP
}

dependencies {
    // Jabel turns the Java 16+ syntax used by the sources into Java 8 bytecode.
    // The javac plugin itself must also be on the compilation classpath because
    // the sources import com.github.bsideup.jabel.Desugar.
    compileOnly "com.github.bsideup.jabel:jabel-javac-plugin:$jabelVersion"
    compileOnly "net.bytebuddy:byte-buddy:$byteBuddyVersion"
    compileOnly "net.bytebuddy:byte-buddy-agent:$byteBuddyVersion"
    compileOnly "net.java.dev.jna:jna:$jnaVersion"

    // MixinBooter ships the Mixin runtime (CleanMix fork) plus
    // zone.rong.mixinbooter.IEarlyMixinLoader for MC 1.8 - 1.12.2.
    // transitive=false: cleanmix / mixinextras are shaded into its jar, and
    // asm/gson/guava are already supplied by Minecraft/Forge at runtime.
    // It is NOT bundled into our jar: users must drop !mixinbooter-11.18.jar into
    // the mods folder (leading '!' so FML loads its coremod before ours).
    //
    // 11.18 and not 12.3: 12.x ModDiscoverer references
    // org.apache.maven.artifact.versioning.*, which Forge 1.10.2 does not ship,
    // and MixinBooterPlugin's constructor calls it while resolving the primary
    // container -> NoClassDefFoundError before any mixin is applied. Verified:
    // 11.18's ModDiscoverer has no maven references at all.
    compile('zone.rong:mixinbooter:11.18') { transitive = false }

    // Mixin 0.8.7 is the AP that matches the Mixin runtime bundled by
    // MixinBooter 11.18. Its dependencies are supplied explicitly because the
    // AP runs inside the JDK 17 javac process, not on the mod runtime classpath.
    mixinAP('org.spongepowered:mixin:0.8.7') { transitive = false }
    mixinAP 'com.google.code.gson:gson:2.2.4'
    mixinAP 'com.google.guava:guava:18.0'
    mixinAP 'org.ow2.asm:asm:9.1'
    mixinAP 'org.ow2.asm:asm-tree:9.1'
    mixinAP 'org.ow2.asm:asm-commons:9.1'
    mixinAP 'org.ow2.asm:asm-analysis:9.1'
    mixinAP 'org.ow2.asm:asm-util:9.1'
    // javac resolves -Xplugin:jabel through the processor path once
    // annotationProcessorPath is set explicitly.
    mixinAP "com.github.bsideup.jabel:jabel-javac-plugin:$jabelVersion"
    mixinAP "net.bytebuddy:byte-buddy:$byteBuddyVersion"
    mixinAP "net.bytebuddy:byte-buddy-agent:$byteBuddyVersion"
    mixinAP "net.java.dev.jna:jna:$jnaVersion"
}

processResources {
    inputs.property 'version', project.version
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
    }
    // FML only picks up access transformers from META-INF + the FMLAT manifest entry.
    rename '(.+_at.cfg)', 'META-INF/$1'
}

jar {
    manifest {
        attributes 'FMLAT': 'yes_steve_model_at.cfg',
                'FMLCorePlugin': 'com.elfmcys.yesstevemodel.core.YsmCorePlugin',
                'FMLCorePluginContainsFMLMod': 'true'
    }
}

// Dev runs don't read FMLCorePlugin from the jar manifest, so load it explicitly.
// MixinBooter's coremod must be listed here as well: it is what turns
// YsmCorePlugin (an IEarlyMixinLoader) into real Mixin configurations.
// Order matters - MixinBooterPlugin first.
tasks.matching { it.name == 'runClient' }.all {
    jvmArgs '-Dfml.coreMods.load=zone.rong.mixinbooter.MixinBooterPlugin,com.elfmcys.yesstevemodel.core.YsmCorePlugin',
            '-Dysm.blockFullscreen=true'
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '10000', '-Xlint:-options', '-Xplugin:jabel']
    // Gradle itself runs on JDK 8 (ForgeGradle 2.3 limitation), but the sources
    // need a JDK 17 parser. Jabel makes it emit Java 8 (major 52) bytecode.
    // CI sets JAVAC17 to the JDK 17 javac it installed; locally we fall back to
    // the pinned zulu build used so far.
    options.fork = true
    options.forkOptions.executable = System.getenv('JAVAC17') ?:
            'D:/JAVA/zulu-jdk17.0.21.0.3/bin/javac.exe'

    // Generate the production SRG refmap at compile time. The AP sees the
    // deobfuscated (MCP/SRG-named) sources and writes the obfuscated names into
    // the refmap; the jar then carries it next to the mixin config.
    // Stock Mixin AP 0.8.7 does not emit @Shadow field mappings into the JSON
    // refmap (only into the SRG output), so doLast adds those from mcp-srg.srg.
    options.annotationProcessorPath = configurations.mixinAP
    options.compilerArgs += [
            "-AoutRefMapFile=${mixinRefmap.absolutePath}",
            "-AreobfSrgFile=${mcpSrg.absolutePath}",
            '-AmappingTypes=searge',
            '-AdefaultObfuscationEnv=searge',
            '-AMSG_NO_OBFDATA_FOR_SHADOW=warning',
            '-AMSG_NO_OBFDATA_FOR_SIMULATED_SHADOW=warning',
            '-AMSG_SHADOW_ON_NON_MIXIN_ELEMENT=warning',
            '-AMSG_TARGET_ELEMENT_NOT_FOUND=warning'
    ]
    doFirst {
        if (!mcpSrg.isFile()) {
            throw new GradleException("MCP SRG file not found: ${mcpSrg}")
        }
        mixinRefmap.parentFile.mkdirs()
    }
    doLast {
        // Never package a missing or empty refmap: the production jar would then
        // contain unresolved MCP names instead of SRG names.
        if (!mixinRefmap.isFile()) {
            throw new GradleException("Mixin refmap was not generated: ${mixinRefmap}")
        }
        def refmap = new groovy.json.JsonSlurper().parseText(mixinRefmap.getText('UTF-8'))
        if (!(refmap.mappings instanceof Map) || refmap.mappings.isEmpty()) {
            throw new GradleException("Mixin refmap has no mappings: ${mixinRefmap}")
        }

        // No @Shadow fields are used by the ported mixins: the one needed field
        // (ClickEvent.Action.NAME_MAPPING) is fetched through
        // ObfuscationReflectionHelper, because MixinBooter 11.18 does not apply
        // refmap entries for @Shadow fields (verified in a production crash:
        // "@Shadow field NAME_MAPPING was not located in the target class").
        // If a future mixin really needs @Shadow, merge its field mapping here
        // from mcp-srg.srg's "FD:" lines instead of hardcoding the SRG name.

        def required = [
                'com/elfmcys/yesstevemodel/mixin/early/client/GuiScreenMixin': ['handleComponentClick'],
                'com/elfmcys/yesstevemodel/mixin/early/ClickEventActionMixin': ['getValueByCanonicalName'],
                'com/elfmcys/yesstevemodel/mixin/early/EntityArrowMixin': ['readEntityFromNBT']
        ]
        required.each { className, members ->
            def classMappings = refmap.mappings[className]
            if (!(classMappings instanceof Map)) {
                throw new GradleException("Mixin refmap is missing class ${className}: ${mixinRefmap}")
            }
            members.each { member ->
                if (!classMappings.containsKey(member)) {
                    throw new GradleException("Mixin refmap is missing ${className}.${member}: ${mixinRefmap}")
                }
            }
        }
    }
}

task dumpcp {
    doLast {
        def f = file("$buildDir/cp.txt")
        f.parentFile.mkdirs()
        f.text = sourceSets.main.compileClasspath.asPath
        println "classpath written: ${f} (${f.text.length()} chars)"
    }
}
